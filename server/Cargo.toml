[package]
name = "markdown-live"
version = "0.4.0"
edition = "2021"
description = "Markdown language server + live browser preview for the Zed editor (MarkDown Live)"
license = "MIT"
build = "build.rs"

[[bin]]
name = "markdown-zed"
path = "src/main.rs"

[dependencies]
comrak = { version = "0.56", default-features = false, features = ["shortcodes", "attributes"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
ureq = { version = "2", features = ["native-certs"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
flate2 = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
