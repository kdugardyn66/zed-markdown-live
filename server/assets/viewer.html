<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MarkDown Live</title>
<link rel="stylesheet" href="/assets/viewer.css">
<link rel="stylesheet" href="/assets/markdown.css">
<link rel="stylesheet" href="/vendor/hljs/styles/github.min.css" id="ml-hljs-light">
<link rel="stylesheet" href="/vendor/hljs/styles/github-dark.min.css" id="ml-hljs-dark" disabled>
</head>
<body>
<header id="ml-bar">
  <button class="icon" id="ml-btn-toc" title="Table of contents (T)"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h13"/></svg></button>
  <span class="file" id="ml-file">MarkDown Live</span>
  <span class="spacer"></span>
  <span class="group" id="ml-extra-buttons"></span>
  <span class="group">
    <button class="icon" id="ml-btn-zoom-out" title="Smaller text (−)"><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
    <button id="ml-btn-zoom" class="zoom" title="Reset text size (0)">100%</button>
    <button class="icon" id="ml-btn-zoom-in" title="Larger text (+)"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  </span>
  <button class="icon" id="ml-btn-sync" title="Scroll with the editor cursor (S)"><svg class="i" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg></button>
  <button class="icon" id="ml-btn-theme" title="Theme: auto / light / dark (D)"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  <button class="icon" id="ml-btn-refresh" title="Re-render (R)"><svg class="i" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
  <button class="icon" id="ml-btn-print" title="Print (Cmd/Ctrl-P)"><svg class="i" viewBox="0 0 24 24"><path d="M6 9V2h12v7"/><rect x="6" y="14" width="12" height="8"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/></svg></button>
</header>
<div id="ml-main">
  <nav id="ml-toc" hidden></nav>
  <div id="ml-scroller">
    <div id="ml-banner" hidden></div>
    <article id="ml-content" class="markdown-body"><p class="ml-waiting">Waiting for the editor…</p></article>
  </div>
</div>
<footer id="ml-status">
  <span class="dot" id="ml-dot"></span><span id="ml-conn">connecting…</span>
  <span id="ml-timing"></span>
  <span id="ml-libs"></span>
  <span class="spacer"></span>
  <span id="ml-ver">MarkDown Live {{VERSION}}</span>
</footer>
<div id="ml-toast"></div>
<script nonce="{{NONCE}}">window.ML_VERSION = "{{VERSION}}";</script>
<script src="/vendor/morphdom/morphdom-umd.min.js"></script>
<script src="/assets/viewer.js"></script>
<script src="/assets/plugins.js"></script>
</body>
</html>
